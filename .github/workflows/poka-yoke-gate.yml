name: Poka-Yoke CI/CD Build Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # JOB 1: Code Quality & Formatting Check (Linting)
  lint-and-format:
    name: Code Style & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linters & Formatters
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black ruff

      - name: Poka-Yoke Gate - Enforce Black Code Formatting
        run: |
          # Checks code formatting without making modifications.
          # Returns exit code 1 on formatting mismatch, immediately failing the gate.
          black --check --diff .

      - name: Poka-Yoke Gate - Static Analysis & Syntax Linting
        run: |
          # Enforces strict syntax, complexity, and unhandled bug patterns.
          ruff check .

  # JOB 2: Secret & Hardcoded API Key Scan
  security-secret-scan:
    name: Secrets & Key Exposure Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to scan full commit history, not just head

      - name: Poka-Yoke Gate - TruffleHog Secret Scanner
        uses: trufflesecurity/trufflehog-actions-experimental@v3.0.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified

  # JOB 3: Quarantined Deployment Gate (Downstream Promotion)
  promote-and-build:
    name: Build & Package Release
    runs-on: ubuntu-latest
    needs: [lint-and-format, security-secret-scan] # Fail-Closed Dependency Gate
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Verified Build Strategy
        run: |
          echo "All Poka-Yoke quality gates passed successfully."
          echo "Proceeding with artifact generation and container builds..."