name: Poka-Yoke Fail-Closed Build Gate

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  poka-yoke-gate:
    name: Security Scan & Strict Linter Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Step 1: Detect Hardcoded Secrets / API Keys (Fail-Closed)
      - name: Secret Leak Detection (TruffleHog)
        uses: trufflesecurity/trufflehog-actions-scan@main
        with:
          extra_args: --debug --only-verified

      # Step 2: Code Formatting Check (Black)
      - name: Check Code Formatting
        run: |
          pip install black
          black --check --diff .

      # Step 3: Linting & Static Analysis (Flake8 / Bandit)
      - name: Run Flake8 and Security Linter
        run: |
          pip install flake8 bandit
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r backend/